[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "durable-agent-workflows-lab"
version = "0.1.0"
description = "Offline, crash-consistent agent workflow orchestrator with SQLite checkpoints"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["durable_workflows*"]
